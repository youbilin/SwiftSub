[package]
name = "swiftsub-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "swiftsub"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gpui-kit = "=0.9.1"
rfd = "0.18"
serde.workspace = true
serde_json.workspace = true
swiftsub-core = { path = "../swiftsub-core" }
swiftsub-fetch = { path = "../swiftsub-fetch" }
swiftsub-server = { path = "../swiftsub-server" }
swiftsub-store = { path = "../swiftsub-store" }
