name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check
      - name: Strict Clippy
        run: scripts/cargo-msvc.bat clippy --workspace --all-targets --locked -- -D warnings
      - name: Full workspace tests
        run: scripts/cargo-msvc.bat test --workspace --locked
      - name: Build release binary
        run: scripts/cargo-msvc.bat build --release --locked -p swiftsub-app
      - name: Desktop startup/restart smoke test
        run: python scripts/validate-desktop-smoke.py --binary target/release/swiftsub.exe

      - name: Build Windows Setup installer and SHA-256 checksums
        shell: pwsh
        run: |
          $rawTag = if ($env:GITHUB_REF_NAME -and $env:GITHUB_REF_NAME.StartsWith('v')) {
            $env:GITHUB_REF_NAME
          } else {
            "v" + ((Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value)
          }
          $ver = $rawTag.TrimStart('v')

          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
            $defaultPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (Test-Path $defaultPath) {
              $iscc = $defaultPath
            } else {
              choco install innosetup -y --no-progress
              $iscc = $defaultPath
            }
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler (ISCC.exe) not found"
          }

          $dist = Join-Path $PWD "dist"
          if (Test-Path $dist) { Remove-Item -Recurse -Force $dist }
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          & $iscc "/DMyAppVersion=$ver" "installer/swiftsub.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $setup = Join-Path $dist "SwiftSub-v$ver-windows-x64-Setup.exe"
          if (-not (Test-Path $setup)) {
            throw "Expected installer not found: $setup"
          }

          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLower()
          "$hash  $(Split-Path -Leaf $setup)" | Out-File -FilePath (Join-Path $dist "SHA256SUMS.txt") -Encoding ascii
          Get-Content (Join-Path $dist "SHA256SUMS.txt")

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*-Setup.exe
            dist/SHA256SUMS.txt
